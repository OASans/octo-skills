# Complete Codex CLI config managed by octo-skills.
# install.sh installs this file as ~/.codex/config.toml.

approval_policy = "on-request"
approvals_reviewer = "auto_review"
sandbox_mode = "workspace-write"
model = "gpt-5.6-sol"
model_reasoning_effort = "xhigh"
model_verbosity = "low"
personality = "pragmatic"

# Allow empty write_stdin polls up to one hour. Callers must request the long
# yield explicitly; the poll still returns as soon as the command exits.
background_terminal_max_timeout = 3600000

