[tui]
status_line = ["model-with-reasoning", "context-usage", "five-hour-limit", "weekly-limit"]
theme = "catppuccin-macchiato"

[tui.model_availability_nux]
"gpt-5.6-sol" = 4

[features]
apps = false
fast_mode = false
memories = false

[features.multi_agent_v2]
enabled = true
max_concurrent_threads_per_session = 20
# wait_agent wakes immediately on agent activity. A five-minute minimum rejects
# token-heavy short polls; omitted waits default to one hour.
min_wait_timeout_ms = 300000
default_wait_timeout_ms = 3600000
max_wait_timeout_ms = 3600000

[notice]
hide_full_access_warning = true
hide_rate_limit_model_nudge = true

[agents]
max_threads = 20

