# Codex CLI config managed by octo-skills.
# install.sh merges these managed keys into ~/.codex/config.toml while preserving
# the keys Codex writes itself (theme, trusted projects, hook trust hashes).

approval_policy = "never"
sandbox_mode = "danger-full-access"
model_context_window = 272000
model_auto_compact_token_limit = 240000

[tui]
# model-with-reasoning = model + thinking effort; context-usage = context-window %
# used; five-hour-limit / weekly-limit = session-limit usage + reset time.
status_line = ["model-with-reasoning", "context-usage", "five-hour-limit", "weekly-limit"]
